<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Validation de Compte</title>
        <style>
            body {
                background-color: #000;
                color: #fff;
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
            }

            .container {
                background-color: rgba(0, 0, 0, 0.7);
                margin: 0 auto;
                padding: 40px;
                max-width: 600px;
                text-align: center;
                border-radius: 10px;
                border: 1px solid #333;
            }

            h1 {
                font-size: 24px;
                color: #fff;
            }

            p {
                font-size: 18px;
                color: #ccc;
            }

            .validation-code {
                background-color: rgba(0, 0, 0, 0.9);
                padding: 20px;
                font-size: 32px;
                color: #00bfff;
                font-weight: bold;
                letter-spacing: 5px;
                margin: 20px 0;
                border-radius: 5px;
                border: 2px solid #00bfff;
            }
            a.more {
                color: rgb(0, 191, 255);
                text-decoration: none;
            }
            .footer {

                margin-top: 30px;
                font-size: 14px;
                color: #888;
            }
            a.more:hover {
                text-decoration: underline;
            }

    </head>
    <body>

        <div class="container">
            <h1> Mail envoyé avec succès :</h1>
            <p> Inscription réussie </p>
